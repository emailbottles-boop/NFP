<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help A Wizza? — Madam Wizzy</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
</head>
<body>

  <nav>
    <a class="brand" href="index.html">MADAM WIZZY</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="help.html" class="active">Help A Wizza?</a></li>
    </ul>
  </nav>

  <section class="hero hero-short">
    <div class="hero-content">
      <p class="eyebrow">Reach Out</p>
      <h1>Help A Wizza?</h1>
      <p class="tagline">Tell me what you need. I'm listening.</p>
    </div>
  </section>

  <section class="contact-section">
    <div class="container contact-container">
      <form class="contact-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="What shall I call you?" required />
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" placeholder="Where can I reach you?" required />
        </div>
        <div class="form-group">
          <label for="message">What Do You Need?</label>
          <textarea id="message" name="message" rows="6" placeholder="Tell Madam Wizzy what's on your mind..." required></textarea>
        </div>
        <button type="submit" class="btn btn-full">Send It Into the Universe</button>
        <p class="form-note" id="form-status"></p>
      </form>
    </div>
  </section>

  <footer>
    <p class="brand">MADAM WIZZY</p>
    <p class="footer-sub">&copy; 2026 Madam Wizzy. All rights reserved.</p>
  </footer>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const status = document.getElementById('form-status');
      status.textContent = 'Your message has been sent into the universe. ✦';
      status.style.opacity = '1';
      e.target.reset();
    }
  </script>

</body>
</html>
